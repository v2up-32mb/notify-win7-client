name: Build NotifyClient (Win7 x86)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Restore packages
        run: dotnet restore src\NotifyClient\NotifyClient.csproj
      - name: Build x86 Release
        run: msbuild src\NotifyClient\NotifyClient.csproj /p:Configuration=Release /p:Platform=x86 /t:Rebuild
      - name: Show output
        shell: pwsh
        run: |
          Get-ChildItem src\NotifyClient\bin\ -Recurse -Filter NotifyClient.exe
          $exe = Get-ChildItem src\NotifyClient\bin\ -Recurse -Filter NotifyClient.exe | Select-Object -First 1
          if ($exe) { $exe.Length; $exe.FullName }
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: NotifyClient-win7-x86
          path: src/NotifyClient/bin/**/NotifyClient.exe
          if-no-files-found: error
      # Tag push (v*) -> publish GitHub Release with the exe attached.
      # Main-branch pushes only build + upload artifact, no release (avoid spam).
      - name: Release exe
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/NotifyClient/bin/**/NotifyClient.exe
          generate_release_notes: true
